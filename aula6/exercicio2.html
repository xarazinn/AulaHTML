<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    table, td
    {
        border: 1px solid black;
        border-collapse: collapse;
        padding: 20px;
    }
    th
    {
        border: 1px solid black;
        border-collapse: collapse;
        padding: 20px;
        background-color: darkgray;
    }
    h1
    {
        background-color: orange;
        color: white;
        padding: 20px;
        text-align: center;
    }
    </style>
</head>
<body>
    <h1>Aula 05 - Exercício 2 de tabelas</h1>
    <table>
        <tr>
            <th colspan="4">Produtos</th>
        </tr>
        <tr>
            <th>Categoria</th>
            <th>Produto</th>
            <th>Preço</th>
            <th>Estoque</th>
        </tr>
        <tr>
            <td rowspan="2">Eletrônicos</td>
            <td>Notebook</td>
            <td>R$ 3.500</td>
            <td>5</td>
        </tr>
        <tr>
            <td>Mouse</td>
            <td>R$ 80</td>
            <td>12</td>
        </tr>
        <tr>
            <td rowspan="2">Informática</td>
            <td>Teclado</td>
            <td>R$ 150</td>
            <td>8</td>
        </tr>
        <tr>
            <td>Monitor</td>
            <td>R$ 900</td>
            <td>4</td>
        </tr>
        <tr>
            <th colspan="2">Total</th>
            <td>4 Produtos</td>
            <td>29</td>
        </tr>
    </table>
</body>
</html>
